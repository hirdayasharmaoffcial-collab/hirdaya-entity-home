<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Hirdaya Sharma</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; margin: 0; padding: 0; color: #333; }
        header { background: #222; color: #fff; padding: 1.5rem 0; text-align: center; }
        nav a { color: #fff; margin: 0 15px; text-decoration: none; font-weight: bold; }
        nav a:hover { text-decoration: underline; }
        main { max-width: 800px; margin: 2rem auto; padding: 0 20px; }
        form { display: flex; flex-direction: column; max-width: 500px; margin-top: 20px; }
        label { margin-top: 10px; font-weight: bold; }
        input, textarea { margin-bottom: 15px; padding: 10px; font-size: 1rem; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 12px; background: #0066cc; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; font-weight: bold; }
        button:hover { background: #005bb5; }
        footer { text-align: center; margin-top: 3rem; padding: 1rem; border-top: 1px solid #ccc; font-size: 0.9rem; }
    </style>
</head>
<body>
    <header>
        <h1>Hirdaya Sharma</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About & Biography</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>
    <main>
        <h2>Contact</h2>
        <p>For professional inquiries, community event organization, or general questions, please use the secure form below. For casual interaction, you can reach out via <a href="https://www.facebook.com/hirdaya.h1" target="_blank">Facebook</a> or <a href="https://www.tiktok.com/@hirdaya.sharma" target="_blank">TikTok</a>.</p>
        
        <form name="contact" method="POST" data-netlify="true">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
            
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            
            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="5" required></textarea>
            
            <button type="submit">Send Message</button>
        </form>
    </main>
    <footer>
        <p>&copy; 2026 Hirdaya Sharma. Official Entity Home.</p>
    </footer>
</body>
</html>
